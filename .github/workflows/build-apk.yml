name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: mushroom-helper-apk-build-v040
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and consolidate V0.4 service source
        run: |
          cat ci/v034/service.part00 \
              ci/v034/service.part01 \
              ci/v034/service.part02 \
              ci/v034/service.part03 \
              ci/v034/service.part04 \
              ci/v034/service.part05 \
              > app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          python3 ci/v035/patch.py
          python3 ci/v036/patch.py
          python3 ci/v037/patch.py
          python3 ci/v038/patch.py
          python3 ci/v039/patch.py
          python3 ci/v040/consolidate.py
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install fixed debug signing key
        run: |
          mkdir -p ~/.android
          base64 -d ci/signing/debug.keystore.b64 > ~/.android/debug.keystore
          test "$(sha256sum ~/.android/debug.keystore | awk '{print $1}')" = "f7dbc40941e43ac6940796b03bb9f69ad416c5af7c5a50a1c03c58b818564662"
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK package, version and archive
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.example.pikminhelper'" /tmp/badging.txt
          grep -q "versionName='0.4.0'" /tmp/badging.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Commit consolidated service source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          git diff --cached --quiet || git commit -m "Consolidate V0.4 service source [skip ci]"
          git push

      - name: Upload verified APK and source
        uses: actions/upload-artifact@v4
        with:
          name: MushroomHelper-v0.4.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
            app/src/main/java/com/example/pikminhelper/automation/MushroomTiming.kt
          if-no-files-found: error
