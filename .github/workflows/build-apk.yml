name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: mushroom-helper-apk-build-v037
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble V0.3.7 service source
        run: |
          cat ci/v034/service.part00 \
              ci/v034/service.part01 \
              ci/v034/service.part02 \
              ci/v034/service.part03 \
              ci/v034/service.part04 \
              ci/v034/service.part05 \
              > app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          python3 ci/v035/patch.py
          python3 ci/v036/patch.py
          python3 ci/v037/patch.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install fixed debug signing key
        run: |
          mkdir -p ~/.android
          base64 -d ci/signing/debug.keystore.b64 > ~/.android/debug.keystore
          test "$(sha256sum ~/.android/debug.keystore | awk '{print $1}')" = "f7dbc40941e43ac6940796b03bb9f69ad416c5af7c5a50a1c03c58b818564662"
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MushroomHelper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
