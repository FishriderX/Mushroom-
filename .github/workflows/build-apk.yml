name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: mushroom-helper-apk-build-v053-fixed-signing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V0.5.3 mandatory ETA census fix
        run: |
          python3 ci/v055/fix.py
          git diff --check
          grep -q "timingCensusRequired" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          grep -q "handleEtaInspectionDetail" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          grep -q "MushroomTiming.parseFinishEtaMillis" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          grep -q "triggerPredictionListRefresh" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          ! grep -q "tryBlindListTargetTap" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          ! grep -q "listTargetTapX" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          grep -q "tryBlindMapTargetTap" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          grep -q "MushroomLobbyPolicy.canJoin" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          grep -q "prepareFullLobbyRecovery" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          grep -q "MAX_JOIN_TAP_ATTEMPTS = 2" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          grep -q "GestureResultCallback" app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install exact project signing key
        run: |
          mkdir -p ci/signing
          base64 -d ci/signing/debug.keystore.b64 > ci/signing/debug.keystore
          test "$(sha256sum ci/signing/debug.keystore | awk '{print $1}')" = "f7dbc40941e43ac6940796b03bb9f69ad416c5af7c5a50a1c03c58b818564662"
          keytool -list -keystore ci/signing/debug.keystore -storepass android -alias androiddebugkey >/dev/null
          EXPECTED_CERT_SHA256=$(keytool -exportcert -keystore ci/signing/debug.keystore -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')
          echo "EXPECTED_CERT_SHA256=$EXPECTED_CERT_SHA256" >> "$GITHUB_ENV"
          echo "Expected signing certificate: $EXPECTED_CERT_SHA256"

      - name: Clean build state
        run: gradle :app:clean --no-build-cache --stacktrace

      - name: Run unit tests without build cache
        run: gradle :app:testDebugUnitTest --no-build-cache --stacktrace

      - name: Build debug APK without build cache
        run: gradle :app:assembleDebug --no-build-cache --stacktrace

      - name: Verify APK package, version, exact signer and archive
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.example.pikminhelper'" /tmp/badging.txt
          grep -q "versionCode='21'" /tmp/badging.txt
          grep -q "versionName='0.5.3'" /tmp/badging.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          ACTUAL_CERT_SHA256=$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -1)
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          echo "Verified signing certificate: $ACTUAL_CERT_SHA256"

      - name: Commit consolidated V0.5.3 service source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/pikminhelper/automation/AutonomousRaceServiceV4.kt
          git diff --cached --quiet || git commit -m "Consolidate V0.5.3 mandatory ETA census [skip ci]"
          git push

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MushroomHelper-v0.5.3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
